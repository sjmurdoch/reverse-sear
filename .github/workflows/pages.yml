name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check the model still runs
        run: |
          python -m pip install --quiet numpy
          python - <<'PY'
          import sys
          sys.path.insert(0, 'model')
          from fit import advise, default_priors, fit

          pr = default_priors(1.0, 0.040, 125.0)
          assert 30 < pr.tau_median < 150, pr.tau_median
          post = fit([0.0, 20.0, 30.0], [5.0, 18.8, 29.0], pr)
          a = advise(post, 30.0, 44.0)
          assert 35 < a.hit_time[1] < 65, a.hit_time
          assert a.next_check_min > 30.0
          print(f"ok: tau prior {pr.tau_median:.0f} min, reaches 44 C at {a.hit_time[1]:.0f} min")
          PY

      - name: Build the page
        run: |
          python web/build.py --out _site/index.html
          touch _site/.nojekyll

      # Requires Settings -> Pages -> Source: GitHub Actions to have been set
      # once by hand. The action can enable Pages itself, but only with a token
      # holding admin rights -- the default GITHUB_TOKEN cannot, and asking it
      # to fails with an unhelpful "Resource not accessible by integration".
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
