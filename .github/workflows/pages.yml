name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  model:
    name: model tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet numpy
      - name: Physics, fitter and scheduling rule
        run: python -m unittest discover -s model -t model -p "test_*.py" -v

  browser:
    name: browser tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # WebKit is the browser that matters -- the app ships to iPhone Safari.
        # Chromium runs alongside it to catch anything that is a real bug rather
        # than an engine difference.
        project: [iphone-webkit, iphone-chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install --quiet numpy
      - run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.project == 'iphone-webkit' && 'webkit' || 'chromium' }}
      - name: The page under an iPhone viewport
        run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

  build:
    needs: [model, browser]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build the page
        run: |
          python web/build.py --out _site/index.html
          touch _site/.nojekyll
      # Requires Settings -> Pages -> Source: GitHub Actions to have been set
      # once by hand. The action can enable Pages itself, but only with a token
      # holding admin rights -- the default GITHUB_TOKEN cannot, and asking it
      # to fails with an unhelpful "Resource not accessible by integration".
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
